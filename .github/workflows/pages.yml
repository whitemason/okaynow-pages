# OkayNow 폰 페이지를 GitHub Pages로 배포한다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 둔다.
# 사용자 도메인은 Settings → Pages → Custom domain에서 정한다(Actions 배포에서는 CNAME 파일을 읽지 않음).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
