# OkayNow 사이트를 Astro로 빌드해 GitHub Pages로 배포한다.
# 저장소 Settings → Pages → Source는 "GitHub Actions", 사용자 도메인은 okaynow.whitemason.club.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          package-manager: npm
      - name: Check fixed paths
        # 차량 앱 QR(?steps= → guide.html, report.html#)과 개인정보 안내 주소가 빌드 결과에 그대로 있는지 확인한다.
        run: test -f dist/index.html && test -f dist/guide.html && test -f dist/report.html && test -f dist/privacy.html && test -f dist/car_top.png

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
